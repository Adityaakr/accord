<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" role="img" aria-label="Accord drawn as three planes: the Sealed Table enclave produces terms and an attestation; the control plane, the agreement contract on NEAR, enforces the approved terms, the bound recipient and the evidence, and refuses everything else into a public log; the data plane, USDC on NEAR, moves only when the control plane sends it." font-family="Satoshi, Manrope, system-ui, sans-serif" font-size="12" style="color:var(--fg,#e8edf2)">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--refuse,#ef5a5a)"/></marker>
  </defs>

  <!-- plane 1: Sealed Table -->
  <polygon points="120,220 840,220 840,232 120,232" style="fill:var(--edge,#0a0f14)"/>
  <polygon points="180,50 900,50 840,220 120,220" style="fill:var(--surface,#16202a);stroke:var(--line,#33404d)" stroke-width="1"/>
  <text x="196" y="68" font-size="11" letter-spacing="0.8" style="fill:var(--muted,#9aa7b4)">Sealed Table · attested enclave · OutLayer and NEAR AI Cloud private inference</text>

  <rect x="300" y="96" width="150" height="40" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="375" y="121" text-anchor="middle" font-weight="600" fill="currentColor">Buyer agent</text>
  <rect x="570" y="96" width="150" height="40" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="645" y="121" text-anchor="middle" font-weight="600" fill="currentColor">Vendor agent</text>
  <rect x="458" y="112" width="104" height="8" rx="4" style="fill:var(--accent,#d8a84a)"/>

  <line x1="375" y1="136" x2="430" y2="166" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="645" y1="136" x2="590" y2="166" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="510" y="152" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">proposals</text>
  <rect x="360" y="166" width="300" height="36" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="510" y="189" text-anchor="middle" fill="currentColor">Deterministic limit check against both mandates</text>

  <!-- sealed mandates, outside the enclave -->
  <text x="26" y="106" font-weight="600" fill="currentColor">Buyer mandate</text>
  <text x="26" y="122" font-size="11" style="fill:var(--muted,#9aa7b4)">sealed in the browser</text>
  <line x1="150" y1="113" x2="300" y2="116" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="974" y="106" text-anchor="end" font-weight="600" fill="currentColor">Vendor mandate</text>
  <text x="974" y="122" text-anchor="end" font-size="11" style="fill:var(--muted,#9aa7b4)">sealed in the browser</text>
  <line x1="850" y1="113" x2="720" y2="116" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- plane 1 to plane 2 -->
  <line x1="510" y1="232" x2="510" y2="282" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="522" y="262" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="currentColor">terms · commitment hashes · attestation</text>

  <!-- plane 2: control plane -->
  <polygon points="120,502 840,502 840,514 120,514" style="fill:var(--edge,#0a0f14)"/>
  <polygon points="180,282 900,282 840,502 120,502" style="fill:var(--surface,#16202a);stroke:var(--line,#33404d)" stroke-width="1"/>
  <text x="196" y="300" font-size="11" letter-spacing="0.8" style="fill:var(--muted,#9aa7b4)">Control plane · agreement contract on NEAR</text>

  <rect x="390" y="312" width="240" height="78" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--accent,#d8a84a)" stroke-width="1.4"/>
  <text x="510" y="334" text-anchor="middle" font-weight="600" fill="currentColor">Agreement controls</text>
  <text x="510" y="350" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">approved terms, both humans</text>
  <text x="510" y="367" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="currentColor">act(Pay) must match</text>
  <text x="510" y="382" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="currentColor">item · evidence · amount · recipient</text>

  <text x="26" y="342" font-weight="600" fill="currentColor">Buyer's agent</text>
  <text x="26" y="358" font-size="11" style="fill:var(--muted,#9aa7b4)">one key, one method</text>
  <line x1="150" y1="350" x2="390" y2="350" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="270" y="342" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="currentColor">act(Pay)</text>

  <rect x="700" y="308" width="160" height="48" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="780" y="328" text-anchor="middle" font-weight="600" fill="currentColor">Agreed observer</text>
  <text x="780" y="344" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">attested enclave</text>
  <line x1="700" y1="332" x2="630" y2="332" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="665" y="324" text-anchor="middle" font-size="10.5" style="fill:var(--muted,#9aa7b4)">slots pass or fail</text>

  <rect x="700" y="366" width="160" height="30" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="780" y="385" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="currentColor">revoke · delete key</text>
  <line x1="700" y1="381" x2="630" y2="372" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="230" y="412" width="200" height="70" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="330" y="433" text-anchor="middle" font-weight="600" fill="currentColor">Payee</text>
  <text x="330" y="450" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">domain proof → settlement authority</text>
  <text x="330" y="466" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">→ buyer accepts · changes wait 24 h</text>
  <line x1="410" y1="412" x2="410" y2="390" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="420" y="406" font-size="10.5" style="fill:var(--muted,#9aa7b4)">bound recipient</text>

  <!-- refusal path -->
  <rect x="878" y="424" width="112" height="52" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--refuse,#ef5a5a)" stroke-width="1.4"/>
  <text x="934" y="446" text-anchor="middle" font-weight="600" style="fill:var(--refuse,#ef5a5a)">Refused</text>
  <text x="934" y="462" text-anchor="middle" font-size="11" style="fill:var(--refuse,#ef5a5a)">public log</text>
  <line x1="630" y1="384" x2="878" y2="446" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr-red)" style="stroke:var(--refuse,#ef5a5a)"/>
  <text x="760" y="404" text-anchor="middle" font-size="10.5" style="fill:var(--refuse,#ef5a5a)">no match</text>

  <!-- plane 2 to plane 3 -->
  <line x1="510" y1="390" x2="510" y2="566" stroke="currentColor" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="522" y="544" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="currentColor">match → ft_transfer from the agreement account</text>

  <!-- plane 3: data plane -->
  <polygon points="120,706 840,706 840,718 120,718" style="fill:var(--edge,#0a0f14)"/>
  <polygon points="180,566 900,566 840,706 120,706" style="fill:var(--surface,#16202a);stroke:var(--line,#33404d)" stroke-width="1"/>
  <text x="196" y="584" font-size="11" letter-spacing="0.8" style="fill:var(--muted,#9aa7b4)">Data plane · USDC on NEAR</text>

  <rect x="400" y="606" width="220" height="44" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="510" y="625" text-anchor="middle" font-weight="600" fill="currentColor">Agreement account</text>
  <text x="510" y="641" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">USDC; no full-access key on it</text>
  <rect x="700" y="606" width="170" height="44" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="785" y="625" text-anchor="middle" font-weight="600" fill="currentColor">Authorised recipient</text>
  <text x="785" y="641" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">the Payee record</text>
  <line x1="620" y1="628" x2="700" y2="628" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="660" y="620" text-anchor="middle" font-size="10.5" style="fill:var(--muted,#9aa7b4)">USDC transfer</text>
  <text x="500" y="684" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">the token contract's answer returns to the agreement in the same transaction</text>

  <text x="500" y="748" text-anchor="middle" font-size="11" style="fill:var(--refuse,#ef5a5a)">Refused requests never reach this plane.</text>
</svg>
