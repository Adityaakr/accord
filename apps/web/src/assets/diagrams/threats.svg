<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" role="img" aria-label="Where each attack stops. Five attacks on an agent that can pay. A message with new bank details makes the agent ask to pay a new account; Agreement controls refuse it because the destination is not the authorised recipient. A fake urgent invoice makes the agent ask for a payment the schedule does not hold; Agreement controls refuse the amount or the timing. A request to update the payee, sent from the vendor&#x27;s real mailbox, changes nothing, because a payee change needs a fresh domain proof, the vendor&#x27;s authority, the buyer&#x27;s acceptance and a 24-hour delay. A stolen agent key meets the same checks and is revoked in one transaction, with any signed transfer listed. A counterpart agent pressing yours past its limit is bounded by the Sealed Table&#x27;s limit check. Not stopped by the contract: a person approving the wrong terms, or a payment the terms already allow." font-family="Satoshi, Manrope, system-ui, sans-serif" font-size="12" style="color:var(--fg,#e8edf2)">
  <defs>
    <marker id="arr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="arr8-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--refuse,#ef5a5a)"/></marker>
  </defs>
  <text x="40" y="24" font-size="11" letter-spacing="0.8" style="fill:var(--muted,#9aa7b4)">Where each attack stops · the agent is assumed to follow every message it reads</text>
  <text x="40" y="50" font-size="11" font-weight="600" letter-spacing="0.6" style="fill:var(--muted,#9aa7b4)">What arrives</text>
  <text x="318" y="50" font-size="11" font-weight="600" letter-spacing="0.6" style="fill:var(--muted,#9aa7b4)">What the agent does</text>
  <text x="526" y="50" font-size="11" font-weight="600" letter-spacing="0.6" style="fill:var(--muted,#9aa7b4)">Where it stops</text>
  <text x="790" y="50" font-size="11" font-weight="600" letter-spacing="0.6" style="fill:var(--muted,#9aa7b4)">Result</text>
  <!-- lane 1 -->
  <rect x="40" y="62" width="250" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="54" y="84" font-weight="600" fill="currentColor">“Our bank details have changed.”</text>
  <rect x="54" y="108" width="29" height="15" rx="4" fill="none" style="stroke:var(--line,#33404d)"/>
  <text x="68.5" y="119" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--muted,#9aa7b4)">BEC</text>
  <rect x="89" y="108" width="110" height="15" rx="4" fill="none" style="stroke:var(--line,#33404d)"/>
  <text x="144.0" y="119" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--muted,#9aa7b4)">ASI01 goal hijack</text>
  <line x1="290" y1="96" x2="318" y2="96" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="318" y="72" width="180" height="48" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="408.0" y="100" text-anchor="middle" font-size="11.5" fill="currentColor">Asks to pay the new account</text>
  <line x1="498" y1="96" x2="526" y2="96" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="526" y="62" width="236" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--accent,#d8a84a)" stroke-width="1.4"/>
  <text x="644.0" y="84" text-anchor="middle" font-weight="600" fill="currentColor">Agreement controls</text>
  <text x="644.0" y="102" text-anchor="middle" font-size="11" fill="currentColor">destination is not the</text>
  <text x="644.0" y="117" text-anchor="middle" font-size="11" fill="currentColor">authorised recipient</text>
  <line x1="762" y1="96" x2="790" y2="96" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr8-red)" style="stroke:var(--refuse,#ef5a5a)"/>
  <rect x="790" y="68" width="180" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--refuse,#ef5a5a)" stroke-width="1.4"/>
  <text x="880.0" y="91" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--refuse,#ef5a5a)">ERR_PAYEE_MISMATCH</text>
  <text x="880.0" y="108" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">nothing signed</text>
  <!-- lane 2 -->
  <rect x="40" y="146" width="250" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="54" y="168" font-weight="600" fill="currentColor">“Urgent: pay invoice 4471 today.”</text>
  <rect x="54" y="192" width="110" height="15" rx="4" fill="none" style="stroke:var(--line,#33404d)"/>
  <text x="109.0" y="203" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--muted,#9aa7b4)">ASI02 tool misuse</text>
  <line x1="290" y1="180" x2="318" y2="180" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="318" y="156" width="180" height="48" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="408.0" y="176" text-anchor="middle" font-size="11.5" fill="currentColor">Asks for a payment</text>
  <text x="408.0" y="192" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">the schedule does not hold</text>
  <line x1="498" y1="180" x2="526" y2="180" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="526" y="146" width="236" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--accent,#d8a84a)" stroke-width="1.4"/>
  <text x="644.0" y="168" text-anchor="middle" font-weight="600" fill="currentColor">Agreement controls</text>
  <text x="644.0" y="186" text-anchor="middle" font-size="11" fill="currentColor">amount and milestone checked</text>
  <text x="644.0" y="201" text-anchor="middle" font-size="11" fill="currentColor">against the approved schedule</text>
  <line x1="762" y1="180" x2="790" y2="180" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr8-red)" style="stroke:var(--refuse,#ef5a5a)"/>
  <rect x="790" y="152" width="180" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--refuse,#ef5a5a)" stroke-width="1.4"/>
  <text x="880.0" y="175" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--refuse,#ef5a5a)">ERR_AMOUNT_MISMATCH</text>
  <text x="880.0" y="192" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--refuse,#ef5a5a)">ERR_MILESTONE_NOT_DUE</text>
  <!-- lane 3 -->
  <rect x="40" y="230" width="250" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="54" y="252" font-weight="600" fill="currentColor">“Please update our payee.”</text>
  <text x="54" y="268" font-size="11" style="fill:var(--muted,#9aa7b4)">sent from the vendor's real mailbox</text>
  <rect x="54" y="276" width="29" height="15" rx="4" fill="none" style="stroke:var(--line,#33404d)"/>
  <text x="68.5" y="287" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--muted,#9aa7b4)">BEC</text>
  <line x1="290" y1="264" x2="318" y2="264" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="318" y="240" width="180" height="48" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="408.0" y="260" text-anchor="middle" font-size="11.5" fill="currentColor">Has no method that</text>
  <text x="408.0" y="276" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">changes a payee</text>
  <line x1="498" y1="264" x2="526" y2="264" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="526" y="230" width="236" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--accent,#d8a84a)" stroke-width="1.4"/>
  <text x="644.0" y="252" text-anchor="middle" font-weight="600" fill="currentColor">Payee</text>
  <text x="644.0" y="270" text-anchor="middle" font-size="11" fill="currentColor">fresh domain proof · vendor authority</text>
  <text x="644.0" y="285" text-anchor="middle" font-size="11" fill="currentColor">buyer accepts · 24-hour delay</text>
  <line x1="762" y1="264" x2="790" y2="264" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="790" y="236" width="180" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--muted,#9aa7b4)" stroke-dasharray="5 4"/>
  <text x="880.0" y="259" text-anchor="middle" font-size="11.5" font-weight="600" fill="currentColor">No change from a message</text>
  <text x="880.0" y="276" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">real changes wait 24 h</text>
  <!-- lane 4 -->
  <rect x="40" y="314" width="250" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="54" y="336" font-weight="600" fill="currentColor">The agent's key is stolen</text>
  <rect x="54" y="360" width="133" height="15" rx="4" fill="none" style="stroke:var(--line,#33404d)"/>
  <text x="120.5" y="371" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--muted,#9aa7b4)">ASI03 privilege abuse</text>
  <line x1="290" y1="348" x2="318" y2="348" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="318" y="324" width="180" height="48" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="408.0" y="344" text-anchor="middle" font-size="11.5" fill="currentColor">Attacker calls <tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">act()</tspan></text>
  <text x="408.0" y="360" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">with the stolen key</text>
  <line x1="498" y1="348" x2="526" y2="348" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="526" y="314" width="236" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--accent,#d8a84a)" stroke-width="1.4"/>
  <text x="644.0" y="336" text-anchor="middle" font-weight="600" fill="currentColor">Agreement controls</text>
  <text x="644.0" y="354" text-anchor="middle" font-size="11" fill="currentColor">the same checks, then</text>
  <text x="644.0" y="369" text-anchor="middle" font-size="11" fill="currentColor">revoke in one transaction</text>
  <line x1="762" y1="348" x2="790" y2="348" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr8-red)" style="stroke:var(--refuse,#ef5a5a)"/>
  <rect x="790" y="320" width="180" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--refuse,#ef5a5a)" stroke-width="1.4"/>
  <text x="880.0" y="343" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--refuse,#ef5a5a)">ERR_REVOKED</text>
  <text x="880.0" y="360" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">signed transfers listed</text>
  <!-- lane 5 -->
  <rect x="40" y="398" width="250" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="54" y="420" font-weight="600" fill="currentColor">The other agent presses yours</text>
  <text x="54" y="436" font-size="11" style="fill:var(--muted,#9aa7b4)">to concede past your limit</text>
  <rect x="54" y="444" width="110" height="15" rx="4" fill="none" style="stroke:var(--line,#33404d)"/>
  <text x="109.0" y="455" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, ui-monospace, monospace" style="fill:var(--muted,#9aa7b4)">ASI07 inter-agent</text>
  <line x1="290" y1="432" x2="318" y2="432" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="318" y="408" width="180" height="48" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="408.0" y="428" text-anchor="middle" font-size="11.5" fill="currentColor">May concede in</text>
  <text x="408.0" y="444" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">the conversation</text>
  <line x1="498" y1="432" x2="526" y2="432" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="526" y="398" width="236" height="68" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--accent,#d8a84a)" stroke-width="1.4"/>
  <text x="644.0" y="420" text-anchor="middle" font-weight="600" fill="currentColor">Sealed Table</text>
  <text x="644.0" y="438" text-anchor="middle" font-size="11" fill="currentColor">code checks every proposal</text>
  <text x="644.0" y="453" text-anchor="middle" font-size="11" fill="currentColor">against both mandates' limits</text>
  <line x1="762" y1="432" x2="790" y2="432" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr8)"/>
  <rect x="790" y="404" width="180" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="880.0" y="427" text-anchor="middle" font-size="11.5" font-weight="600" fill="currentColor">Terms inside your limits,</text>
  <text x="880.0" y="444" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">or no deal; you approve</text>
  <rect x="40" y="488" width="930" height="40" rx="6" fill="none" style="stroke:var(--line,#33404d)"/>
  <text x="56" y="512" font-size="11.5" style="fill:var(--muted,#9aa7b4)">Not stopped by the contract: a person approving the wrong terms, or a payment the terms already allow. Those stay with people, on the record.</text>
</svg>
