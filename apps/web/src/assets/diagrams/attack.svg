<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="The security demonstration: a message in the public inbox is read by a deliberately literal agent, which requests a payment; the contract compares the destination and the amount with the approved terms and refuses a mismatch into a public log, or pays in USDC on NEAR on a match. Revocation deletes the agent's key and stops every new payment at once; it does not recall a payment already made." font-family="Satoshi, Manrope, system-ui, sans-serif" font-size="12" style="color:var(--fg,#e8edf2)">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="arr3-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--refuse,#ef5a5a)"/></marker>
    <marker id="arr3-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--pass,#4fc48a)"/></marker>
  </defs>
  <rect x="40" y="40" width="140" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="110" y="63" text-anchor="middle" font-weight="600" fill="currentColor">Public inbox</text>
  <text x="110" y="80" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">anyone can write</text>
  <line x1="180" y1="68" x2="260" y2="68" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr3)"/>
  <text x="220" y="58" text-anchor="middle" font-size="10.5" style="fill:var(--muted,#9aa7b4)">"new bank details"</text>

  <rect x="260" y="40" width="160" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="340" y="63" text-anchor="middle" font-weight="600" fill="currentColor">Buyer's agent</text>
  <text x="340" y="80" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">deliberately literal</text>
  <line x1="420" y1="68" x2="490" y2="68" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr3)"/>
  <text x="455" y="58" text-anchor="middle" font-size="10.5" style="fill:var(--muted,#9aa7b4)">tries</text>

  <rect x="490" y="40" width="210" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="595" y="63" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="currentColor">act(Pay{destination, amount})</text>
  <text x="595" y="80" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">one key, one method</text>
  <line x1="700" y1="68" x2="760" y2="68" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr3)"/>

  <rect x="760" y="30" width="210" height="76" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--accent,#d8a84a)" stroke-width="1.4"/>
  <text x="865" y="52" text-anchor="middle" font-weight="600" fill="currentColor">Agreement controls</text>
  <text x="865" y="70" text-anchor="middle" font-size="11" fill="currentColor">destination = bound recipient?</text>
  <text x="865" y="86" text-anchor="middle" font-size="11" fill="currentColor">amount = approved amount?</text>

  <line x1="800" y1="106" x2="700" y2="160" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr3-red)" style="stroke:var(--refuse,#ef5a5a)"/>
  <text x="742" y="120" text-anchor="middle" font-size="10.5" style="fill:var(--refuse,#ef5a5a)">no match</text>
  <rect x="470" y="160" width="270" height="64" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--refuse,#ef5a5a)" stroke-width="1.4"/>
  <text x="605" y="182" text-anchor="middle" font-weight="600" style="fill:var(--refuse,#ef5a5a)">Refused, recorded in the public log</text>
  <text x="605" y="199" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" style="fill:var(--refuse,#ef5a5a)">ERR_PAYEE_MISMATCH</text>
  <text x="605" y="214" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" style="fill:var(--refuse,#ef5a5a)">ERR_AMOUNT_MISMATCH</text>

  <line x1="900" y1="106" x2="880" y2="160" stroke-width="1.4" marker-end="url(#arr3-ok)" style="stroke:var(--pass,#4fc48a)"/>
  <text x="915" y="136" text-anchor="middle" font-size="10.5" style="fill:var(--pass,#4fc48a)">match</text>
  <rect x="770" y="160" width="200" height="64" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--pass,#4fc48a)" stroke-width="1.4"/>
  <text x="870" y="182" text-anchor="middle" font-weight="600" style="fill:var(--pass,#4fc48a)">Paid in USDC on NEAR</text>
  <text x="870" y="199" text-anchor="middle" font-size="11" fill="currentColor">USDC to the bound recipient,</text>
  <text x="870" y="214" text-anchor="middle" font-size="11" fill="currentColor">at the approved amount only</text>

  <text x="40" y="262" font-size="11" letter-spacing="0.8" style="fill:var(--muted,#9aa7b4)">Revocation, exactly</text>
  <rect x="40" y="274" width="200" height="50" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="140" y="294" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="currentColor">revoke</text>
  <text x="140" y="311" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">agent key deleted, one transaction</text>
  <line x1="240" y1="299" x2="290" y2="299" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr3)"/>
  <rect x="290" y="274" width="200" height="50" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="390" y="294" text-anchor="middle" font-weight="600" fill="currentColor">New payments: none</text>
  <text x="390" y="311" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">the contract makes no further payments</text>
  <line x1="490" y1="299" x2="540" y2="299" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr3)"/>
  <rect x="540" y="274" width="220" height="50" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="650" y="294" text-anchor="middle" font-weight="600" fill="currentColor">Already paid</text>
  <text x="650" y="311" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">stays paid, on the record</text>
  <line x1="760" y1="299" x2="810" y2="299" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr3)"/>
  <rect x="810" y="274" width="160" height="50" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
  <text x="890" y="294" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="currentColor">not a recall</text>
  <text x="890" y="311" text-anchor="middle" font-size="11" style="fill:var(--muted,#9aa7b4)">to the bound recipient, approved amount</text>
</svg>
