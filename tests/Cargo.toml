[package]
name = "accord-sandbox"
description = "Sandbox integration tests and `make sandbox`: the real contracts on a local NEAR node, jobs replaced by the mock signer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
accord-core = { path = "../crates/accord-core" }
accord-jobkit = { path = "../crates/accord-jobkit", features = ["native"] }
accord-sealed-table = { path = "../jobs/sealed-table" }
accord-payee = { path = "../jobs/payee" }
accord-observer = { path = "../jobs/observer" }
near-workspaces = "0.24.0"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json.workspace = true
serde.workspace = true
ed25519-dalek = "2"
base64 = "0.22"
bs58 = "0.5"
sha2.workspace = true
hex.workspace = true
