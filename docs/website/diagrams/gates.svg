<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="The control plane as gates: every payment request from the agent's single key passes six checks in a fixed order, key and state, timing, amount, recipient, destination and fee; any gate refuses with a named error into the public refusal log, and only a request that passes all six gets a signature request." font-family="Satoshi, Manrope, system-ui, sans-serif" font-size="12" style="color:var(--fg,#e8edf2)">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
    <marker id="arr6-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--pass,#4fc48a)"/></marker>
  </defs>
  <text x="40" y="30" font-size="11" letter-spacing="0.8" style="fill:var(--muted,#9aa7b4)">The control plane as gates · every request, the same order, no gate skipped</text>
  <text x="40" y="62" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="currentColor">act(Pay{milestone, amount, recipient version, destination})</text>
  <text x="40" y="78" font-size="11" style="fill:var(--muted,#9aa7b4)">from the agent's one key, which can call this one method</text>
  <line x1="40" y1="118" x2="60" y2="118" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr6)"/>

  <g style="fill:var(--surface-2,#1d2935);stroke:var(--accent,#d8a84a)" stroke-width="1.2">
    <polygon points="62,96 178,96 192,118 178,140 62,140 76,118"/>
    <polygon points="200,96 316,96 330,118 316,140 200,140 214,118"/>
    <polygon points="338,96 454,96 468,118 454,140 338,140 352,118"/>
    <polygon points="476,96 592,96 606,118 592,140 476,140 490,118"/>
    <polygon points="614,96 730,96 744,118 730,140 614,140 628,118"/>
    <polygon points="752,96 868,96 882,118 868,140 752,140 766,118"/>
  </g>
  <g font-weight="600" text-anchor="middle" fill="currentColor">
    <text x="130" y="122">Key and state</text>
    <text x="268" y="122">Timing</text>
    <text x="406" y="122">Amount</text>
    <text x="544" y="122">Recipient</text>
    <text x="682" y="122">Destination</text>
    <text x="820" y="122">Fee</text>
  </g>
  <line x1="882" y1="118" x2="900" y2="118" stroke-width="1.4" marker-end="url(#arr6-ok)" style="stroke:var(--pass,#4fc48a)"/>
  <rect x="902" y="96" width="88" height="44" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--pass,#4fc48a)" stroke-width="1.4"/>
  <text x="946" y="115" text-anchor="middle" font-weight="600" font-size="11.5" style="fill:var(--pass,#4fc48a)">Sign</text>
  <text x="946" y="130" text-anchor="middle" font-size="10" fill="currentColor">nonce reserved</text>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" text-anchor="middle" style="fill:var(--refuse,#ef5a5a)">
    <text x="130" y="164">ERR_NOT_AGENT_KEY</text><text x="130" y="178">ERR_REVOKED</text><text x="130" y="192">ERR_BAD_STATE</text>
    <text x="268" y="164">ERR_MILESTONE_NOT_DUE</text><text x="268" y="178">ERR_PAYMENT_IN_FLIGHT</text><text x="268" y="192">ERR_ALREADY_PAID</text>
    <text x="406" y="164">ERR_AMOUNT_MISMATCH</text><text x="406" y="178">ERR_CAP_EXCEEDED</text><text x="406" y="192">ERR_TOTAL_EXCEEDED</text>
    <text x="544" y="164">ERR_PAYEE_MISSING</text><text x="544" y="178">ERR_PAYEE_VERSION</text>
    <text x="682" y="164">ERR_CANARY → revoke</text><text x="682" y="178">ERR_PAYEE_MISMATCH</text>
    <text x="820" y="164">ERR_FEE_POLICY</text>
  </g>
  <g stroke-dasharray="2 4" style="stroke:var(--refuse,#ef5a5a)">
    <line x1="130" y1="198" x2="130" y2="232"/><line x1="268" y1="198" x2="268" y2="232"/><line x1="406" y1="198" x2="406" y2="232"/><line x1="544" y1="184" x2="544" y2="232"/><line x1="682" y1="184" x2="682" y2="232"/><line x1="820" y1="170" x2="820" y2="232"/>
  </g>
  <rect x="62" y="232" width="820" height="36" rx="6" fill="none" style="stroke:var(--refuse,#ef5a5a)" stroke-width="1.4"/>
  <text x="472" y="255" text-anchor="middle" font-weight="600" style="fill:var(--refuse,#ef5a5a)">Public refusal log · every refusal is an on-chain event with its reason · nothing was signed</text>
  <text x="40" y="290" font-size="11" style="fill:var(--muted,#9aa7b4)">The agent cannot reorder, skip or argue with a gate. Humans change the inputs (approve an exception, accept a new recipient); the gates stay the same.</text>
</svg>
