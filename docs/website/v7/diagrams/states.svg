<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="A deal room moves through four states, Sealed, Attested, Executing and Settled; under each state, what the other side can see and what the contract checks." font-family="Satoshi, Manrope, system-ui, sans-serif" font-size="12" style="color:var(--fg,#e8edf2)">
  <defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <g>
    <rect x="40" y="40" width="166" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
    <text x="123" y="74" text-anchor="middle" font-weight="600" font-size="14" fill="currentColor">Sealed</text>
    <rect x="290" y="40" width="166" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
    <text x="373" y="74" text-anchor="middle" font-weight="600" font-size="14" fill="currentColor">Attested</text>
    <rect x="540" y="40" width="166" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--accent,#d8a84a)" stroke-width="1.4"/>
    <text x="623" y="74" text-anchor="middle" font-weight="600" font-size="14" fill="currentColor">Executing</text>
    <rect x="790" y="40" width="166" height="56" rx="6" style="fill:var(--surface-2,#1d2935);stroke:var(--line,#33404d)"/>
    <text x="873" y="74" text-anchor="middle" font-weight="600" font-size="14" fill="currentColor">Settled</text>
  </g>
  <line x1="206" y1="68" x2="290" y2="68" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="248" y="58" text-anchor="middle" font-size="10.5" style="fill:var(--muted,#9aa7b4)">one run</text>
  <line x1="456" y1="68" x2="540" y2="68" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="498" y="58" text-anchor="middle" font-size="10.5" style="fill:var(--muted,#9aa7b4)">both approve</text>
  <line x1="706" y1="68" x2="790" y2="68" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr2)"/>
  <text x="748" y="58" text-anchor="middle" font-size="10.5" style="fill:var(--muted,#9aa7b4)">nothing in flight</text>

  <g font-size="11">
    <text x="40" y="126" style="fill:var(--muted,#9aa7b4)">Other side sees</text>
    <text x="40" y="143" fill="currentColor">a commitment hash</text>
    <text x="40" y="176" style="fill:var(--muted,#9aa7b4)">Contract checks</text>
    <text x="40" y="193" fill="currentColor">both commitments recorded;</text>
    <text x="40" y="208" fill="currentColor">one run per pair</text>

    <text x="290" y="126" style="fill:var(--muted,#9aa7b4)">Other side sees</text>
    <text x="290" y="143" fill="currentColor">the terms and the job id</text>
    <text x="290" y="176" style="fill:var(--muted,#9aa7b4)">Contract checks</text>
    <text x="290" y="193" fill="currentColor">measurement approved, commitments</text>
    <text x="290" y="208" fill="currentColor">match, limits checked</text>

    <text x="540" y="126" style="fill:var(--muted,#9aa7b4)">Other side sees</text>
    <text x="540" y="143" fill="currentColor">every payment and refusal, on NEAR</text>
    <text x="540" y="176" style="fill:var(--muted,#9aa7b4)">Contract checks</text>
    <text x="540" y="193" font-family="JetBrains Mono, ui-monospace, monospace" fill="currentColor">item · evidence · amount</text>
    <text x="540" y="208" font-family="JetBrains Mono, ui-monospace, monospace" fill="currentColor">· authorised recipient</text>

    <text x="790" y="126" style="fill:var(--muted,#9aa7b4)">Other side sees</text>
    <text x="790" y="143" fill="currentColor">the record both can cite</text>
    <text x="790" y="176" style="fill:var(--muted,#9aa7b4)">Contract checks</text>
    <text x="790" y="193" fill="currentColor">no payment pending;</text>
    <text x="790" y="208" fill="currentColor">remainder refunded</text>
  </g>
</svg>
