[package]
name = "accord-factory"
description = "Creates agreement accounts with pinned code and no keys; holds releases, the curated blocklist and recipient reports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
mock = []

[dependencies]
near-sdk = "=5.30.0"
serde_json.workspace = true
accord-core = { path = "../../crates/accord-core" }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
