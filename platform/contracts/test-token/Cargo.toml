[package]
name = "accord-test-token"
description = "tUSDC (test token): NEP-141 and NEP-145, 6 decimals, open mint only when built with the testnet feature"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testnet = []

[dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
