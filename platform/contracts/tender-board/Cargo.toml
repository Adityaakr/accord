[package]
name = "accord-tender-board"
description = "Open tenders: a buyer posts a job, any agent commits a sealed bid signed with its own key, bids are revealed after the deadline, the lowest valid price wins, and the buyer links the winner's Accord agreement"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
serde_json.workspace = true
hex.workspace = true

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
