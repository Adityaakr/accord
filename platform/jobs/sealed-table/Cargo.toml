[package]
name = "accord-sealed-table"
description = "The Sealed Table: Accord's enclave negotiation job (OutLayer, wasm32-wasip2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "accord-sealed-table"
path = "src/main.rs"

[dependencies]
accord-core = { path = "../../crates/accord-core" }
accord-jobkit = { path = "../../crates/accord-jobkit" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
hkdf = "=0.12.4"
ed25519-dalek = "=2.2.0"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
sha3 = "=0.10.8"
bs58 = "=0.5.1"
base64 = "=0.22.1"
ecies = { version = "=0.2.14", default-features = false, features = ["pure", "std"] }
dcap-qvl = { version = "=0.7.0", default-features = false, features = ["std", "rustcrypto", "default-x509"] }

[target.'cfg(target_os = "wasi")'.dependencies]
wasi = "=0.13.3"

[dev-dependencies]
base64 = "=0.22.1"

# The native HTTPS transport for the live tests only; never in a wasm build.
[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
ureq = "=2.12.1"
